function manualMachine(){show('Neue Maschine manuell erfassen','<div class="notice">Bestätigt: Keines der Katastergeräte passt. Der Fund bleibt zur Desktop-Prüfung vorläufig.</div><label>Name *<input id="name"></label><label>Inventarnummer<input id="inv"></label><label>Firma<input id="company"></label><label>Ist-Farbe<select id="color">'+opt(['Grün','Gelb','Rot'])+'</select></label><label>Ist-Nummer<input id="number"></label><label>Kommentar<textarea id="note"></textarea></label>','Neue Maschine speichern',async()=>{if(!$('name').value.trim())throw Error('Name fehlt');const n=clone(S);n.arrivals.push({id:uid(),packageId:S.current,name:$('name').value.trim(),inventory:$('inv').value.trim(),company:$('company').value.trim(),section,actualColor:$('color').value,actualNumber:num($('number').value),comment:$('note').value.trim(),createdAt:now(),resolved:false});await save(n);closeModal();draw()})}
const headers=['Typ','ID','Maschinen-ID','Maschinenname','Kennzeichen','Inventarnummer','Firma','Erwartete Sektion','Kontrollstandort','Kontrolldatum','Soll-Farbe','Soll-Labelnummer','Ist-Farbe','Ist-Labelnummer','Ergebnis','Abweichungen','Kommentar','Neue Maschine','Paket-ID','Exportdatum','Ersetzt Kontroll-ID','Daten-JSON'];function resultRow(kind,x,p){return[kind,x.id||'',x.machineId||'',x.name||'',x.number||'',x.inventory||'',x.company||'',(x.expectedSections||[]).join(' / '),x.location||x.section||'',x.date||'',x.expectedColor||'',x.expectedNumber||'',x.actualColor||'',x.actualNumber||'',x.result||'',(x.deviations||[]).join('; '),x.comment||'',kind==='ARRIVAL'?'Ja':'Nein',x.packageId||p.id,p.exportedAt,x.supersedes||'',JSON.stringify(x)]}async function exportResults(){const p=pack(),controls=S.controls.filter(x=>x.packageId===p.id),arrivals=S.arrivals.filter(x=>x.packageId===p.id);if(!controls.length&&!arrivals.length)throw Error('Keine Ergebnisse');const r={format:'sl3-results/1',id:uid(),packageId:p.id,exportedAt:now(),package:p,controls,arrivals},meta={...r,package:{...p,machines:undefined},controls:undefined,arrivals:undefined};const rows=[headers,resultRow('META',meta,r),...p.machines.map(x=>resultRow('MACHINE',x,r)),...controls.map(x=>resultRow('CONTROL',x,r)),...arrivals.map(x=>resultRow('ARRIVAL',x,r))];download(xlsxBlob('Austausch',rows),'SL3_Kontrollergebnisse_'+r.id+'.xlsx')}
$('file').onchange=e=>{const f=e.target.files[0];if(f)run(()=>importPackage(f));e.target.value=''};$('packageSelect').onchange=e=>run(async()=>{const n=clone(S);n.current=e.target.value;await save(n);section='';render()});$('section').onchange=e=>{section=e.target.value;render()};$('search').oninput=e=>{query=e.target.value;draw()};$('cards').onclick=e=>{const ok=e.target.closest('[data-ok]'),no=e.target.closest('[data-no]');if(ok)control(ok.dataset.ok,true);if(no)control(no.dataset.no,false)};$('add').onclick=chooseMachine;$('export').onclick=()=>run(exportResults);$('cancel').onclick=closeModal;init().catch(e=>msg(e.message));if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(e=>msg(e.message));
</script></body></html>
